[package]
name = "wex-app"
version = "0.1.0"
description = "Wex Launcher Application"
edition = "2021"

[lib]
name = "wex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["time", "sync", "rt", "macros"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
wex-core = { path = "../../core/wex-core" }
wex-ipc = { path = "../../core/wex-ipc" }
wex-extras = { path = "../../core/wex-extras" }
wex-net = { path = "../../core/wex-net" }
wex-social = { path = "../../core/wex-social" }

[dev-dependencies]
tempfile = "3.8"
wiremock = "0.6"
