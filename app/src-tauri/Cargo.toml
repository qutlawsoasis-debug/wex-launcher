[package]
name = "wex-app"
version = "0.9.0"
description = "Wex Launcher Application"
edition = "2021"

[lib]
name = "wex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.0.0"
minisign-verify = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["time", "sync", "rt", "macros"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1.10"
semver = "1"
sha2 = "0.10"
tempfile = "3.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
wex-core = { path = "../../core/wex-core" }
wex-ipc = { path = "../../core/wex-ipc" }
wex-extras = { path = "../../core/wex-extras" }
wex-net = { path = "../../core/wex-net" }
wex-social = { path = "../../core/wex-social" }
tauri-plugin-notification = "2.8.0"

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }
wiremock = "0.6"
