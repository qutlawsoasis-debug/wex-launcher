[package]
name = "wex-net"
version = "0.9.1"
edition = "2021"
authors = ["agy-a3 <agy-a3@aura.local>"]
description = "Network modules for Wex launcher: Minecraft SLP ping, servers.dat NBT, Lobby API, ModSync, Playit tunnel"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
regex = "1.10"
tracing = "0.1"
futures-util = "0.3"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.12"
