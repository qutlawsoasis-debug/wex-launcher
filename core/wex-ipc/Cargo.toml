[package]
name = "wex-ipc"
version = "0.9.0"
edition = "2021"
description = "Typed IPC contract between Wex Rust core and UI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
wex-net = { path = "../wex-net" }
wex-extras = { path = "../wex-extras" }
wex-social = { path = "../wex-social" }
ts-rs = "10.1"

[dev-dependencies]
tempfile = "3.12"
