[package]
name = "wex-core"
version = "0.9.2"
edition = "2021"
authors = ["AuraDev"]
description = "Core launcher library for Wex (Aura Minecraft Launcher)"

[lib]
doctest = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
futures-util = "0.3"
directories = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
wex-ipc = { path = "../wex-ipc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
