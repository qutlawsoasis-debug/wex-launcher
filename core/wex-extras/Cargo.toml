[package]
name = "wex-extras"
version = "0.9.2"
edition = "2021"
description = "Crash analyzer, skins, Discord RPC, old launcher import, and graphics presets for Wex"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.12"
