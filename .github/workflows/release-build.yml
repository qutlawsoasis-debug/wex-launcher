name: Release Build

permissions:
  contents: read

"on":
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for update manifest'
        required: false
        default: 'Wex Launcher manual release build'
      publish:
        description: 'Publish a GitHub Release (vX.Y.Z) so installed launchers can auto-update'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installers (NSIS & MSI)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --workspaces=false --prefer-offline --foreground-scripts

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            core -> target

      - name: Check signing key configuration
        id: signing-check
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Warning "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not configured in repository secrets. Proceeding with unsigned build."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is detected. Signing enabled."
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build Tauri installers (NSIS & MSI)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Tauri reads the key password from this exact variable name.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@^2.2.0 build

      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\generate-latest-json.ps1 -Notes "${{ github.event.inputs.notes || 'Wex Launcher update' }}"

      - name: Verify updater signature matches embedded pubkey
        if: ${{ steps.signing-check.outputs.signed == 'true' }}
        shell: pwsh
        run: |
          python -m pip install --quiet pynacl
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          python scripts/verify-updater-signature.py app/src-tauri/tauri.conf.json $exe.FullName "$($exe.FullName).sig"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wex-NSIS-Setup
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.zip
            target/release/bundle/nsis/*.sig
          if-no-files-found: warn

      - name: Upload MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wex-MSI-Package
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
          if-no-files-found: warn

      - name: Upload Updater Manifest
        uses: actions/upload-artifact@v4
        with:
          name: Wex-Updater-Manifest
          path: latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing-check.outputs.signed }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          if ($env:SIGNED -ne 'true') {
            Write-Error "Refusing to publish an unsigned release: installed launchers could not verify it. Add the TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          }
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $files = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe, target/release/bundle/nsis/*-setup.exe.sig, target/release/bundle/msi/*.msi, target/release/bundle/msi/*.msi.sig -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $files += (Resolve-Path latest.json).Path
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump the version before publishing again."
            exit 1
          }
          gh release create $tag @files --target $env:GITHUB_SHA --title "Wex $version" --notes "$env:NOTES"
