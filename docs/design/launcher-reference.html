<title>Wex Лаунчер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: custom
 * paper: system background, light and dark · accent: oklch(0.58 0.19 255) systemBlue · display: Onest 800 · body: Onest
 * nav: sidebar with a build library, persistent launch bar · signature: the launch bar that becomes the install progress · states: ready, launching, running, stopped, empty search, no worlds
 * axes: world/Onest/systemBlue · posture: library · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P5 H4 E5 S4 R5 V4 · weakest: S, a sidebar plus pages is a familiar shell; kept because it is what makes a launcher fast to use, character comes from the build covers set in type */
/* Hallmark · waive 12 · springs only on indicators, toggles, toasts and the build pair · Apple system controls use spring motion and AGENTS.md makes Apple the spec */
/* WEX — референс v8. Схема профессиональных лаунчеров: боковая панель с библиотекой сборок, страницы, постоянная панель запуска.
   Без игровой графики и без стиля старого лаунчера: системные цвета и материалы Apple, обложки сборок из цвета и типографики (AGENTS.md: systemBlue на главном действии, systemGreen у переключателей, systemRed для остановки). */
:root {
  /* Светлая тема (системные цвета Apple) */
  --blue: #0064d2; --blue-hi: #0a6fe0; --blue-text: #0066d6; --blue-ink: #ffffff; --blue-tint: rgba(0, 122, 255, 0.12);
  --green: #34c759; --red: #ff3b30; --orange: #ff9500;
  --label: #1d1d1f; --label-2: rgba(60, 60, 67, 0.72); --label-3: rgba(60, 60, 67, 0.5);
  --fill: rgba(120, 120, 128, 0.2); --fill-2: rgba(120, 120, 128, 0.14); --fill-3: rgba(118, 118, 128, 0.08);
  --separator: rgba(60, 60, 67, 0.14);
  --base: #f5f5f7;                         /* фон окна */
  --side: rgba(236, 236, 240, 0.86);       /* боковая панель */
  --bar: rgba(250, 250, 252, 0.9);         /* панель запуска */
  --card: #ffffff;                         /* группы, карточки */
  --card-hover: #fbfbfd;
  --edge: rgba(0, 0, 0, 0.08);
  --shade: rgba(0, 0, 0, 0.08);
  --veil: rgba(245, 245, 247, 0.72);
  --veil-strong: rgba(255, 255, 255, 0.97);
  --cover-ink: #ffffff;
  --cover-1211: #1e5fd8;                   /* цвет сборки 1.21.1 */
  --cover-1201: #1f8a5b;                   /* цвет сборки 1.20.1 */
  --cover-new: rgba(120, 120, 128, 0.14);
  --hero-btn: rgba(255, 255, 255, 0.2); --hero-btn-hi: rgba(255, 255, 255, 0.28);
  --pal-0: #1e5fd8; --pal-1: #1f8a5b; --pal-2: #d9681e; --pal-3: #d6336c; --pal-4: #0f8f9c; --pal-5: #4a4f5c;
  --cape-0: #0a6fe0; --cape-0-t: #9fd0ff; --cape-1: #9aa0a8; --cape-1-t: #e6e8eb; --cape-2: rgba(120, 120, 128, 0.4); --cape-2-t: rgba(120, 120, 128, 0.6); --cape-3: transparent; --cape-3-t: transparent;
  --stage-a: rgba(0, 122, 255, 0.10); --stage-b: rgba(120, 120, 128, 0.06); --floor: rgba(0, 0, 0, 0.18); --warn-fill: rgba(255, 149, 0, 0.9);
  --mwl-bg: #e8e8ed; --mwl-a: #ffffff; --mwl-b: #dcdce1; --mwl-c: #007aff; --mwd-bg: #1c1c1f; --mwd-a: #2a2a2e; --mwd-b: #232327; --mwd-c: #0a84ff; --mws-a: rgba(140, 140, 150, 0.5); --mws-b: rgba(140, 140, 150, 0.35);
  --av-1: #ff9500; --av-2: #5ac8fa; --av-3: #34c759; --av-4: #ff2d55; --av-5: #8e8e93;
  --font: "Onest", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --t-cap: 12px; --t-foot: 13px; --t-sub: 15px; --t-body: 16px; --t-t3: 20px; --t-t2: 24px; --t-t1: 32px; --t-hero: 56px;
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;
  --ease: cubic-bezier(.32, .72, 0, 1); --dur-micro: 120ms; --dur-short: 240ms;
  --spring: cubic-bezier(.34, 1.32, .64, 1); --dur-ind: 420ms; --dur-page: 380ms; --dur-pair: 640ms;
  --lift: 0 10px 30px rgba(0, 0, 0, 0.12); --sweep: rgba(255, 255, 255, 0.45);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --blue: #0a6fe0; --blue-hi: #1a7ef0; --blue-text: #4ba3ff; --blue-tint: rgba(10, 132, 255, 0.18);
  --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
  --label: #f5f5f7; --label-2: rgba(235, 235, 245, 0.64); --label-3: rgba(235, 235, 245, 0.4);
  --fill: rgba(120, 120, 128, 0.32); --fill-2: rgba(120, 120, 128, 0.22); --fill-3: rgba(118, 118, 128, 0.14);
  --separator: rgba(84, 84, 88, 0.5);
  --base: #161618; --side: rgba(30, 30, 33, 0.9); --bar: rgba(28, 28, 31, 0.92); --card: #1f1f22; --card-hover: #26262a;
  --edge: rgba(255, 255, 255, 0.08); --shade: rgba(0, 0, 0, 0.4); --veil: rgba(10, 10, 12, 0.6); --veil-strong: rgba(30, 30, 33, 0.98);
  --cover-1211: #2a6ae6; --cover-1201: #239a66;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --blue: #0a6fe0; --blue-hi: #1a7ef0; --blue-text: #4ba3ff; --blue-tint: rgba(10, 132, 255, 0.18);
  --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
  --label: #f5f5f7; --label-2: rgba(235, 235, 245, 0.64); --label-3: rgba(235, 235, 245, 0.4);
  --fill: rgba(120, 120, 128, 0.32); --fill-2: rgba(120, 120, 128, 0.22); --fill-3: rgba(118, 118, 128, 0.14);
  --separator: rgba(84, 84, 88, 0.5);
  --base: #161618; --side: rgba(30, 30, 33, 0.9); --bar: rgba(28, 28, 31, 0.92); --card: #1f1f22; --card-hover: #26262a;
  --edge: rgba(255, 255, 255, 0.08); --shade: rgba(0, 0, 0, 0.4); --veil: rgba(10, 10, 12, 0.6); --veil-strong: rgba(30, 30, 33, 0.98);
  --cover-1211: #2a6ae6; --cover-1201: #239a66;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--base); color: var(--label); font-family: var(--font); font-size: var(--t-body); line-height: 1.4; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--blue-text); outline-offset: 2px; transition: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
canvas.px { image-rendering: pixelated; display: block; }
img { display: block; max-width: 100%; }

/* ── Окно ─────────────────────────────── */
.app { position: relative; height: 100%; max-width: 1480px; margin: 0 auto; border-radius: 12px; overflow: hidden; isolation: isolate; display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; box-shadow: 0 0 0 1px var(--edge), 0 30px 80px var(--shade); }
.app { background: var(--base); }

/* ── Боковая панель ───────────────────── */
.side { grid-row: 1 / 3; background: var(--side); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); border-right: 1px solid var(--edge); display: flex; flex-direction: column; padding: 20px 12px 12px; gap: 4px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 16px; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand-mark { display: flex; gap: 4px; align-items: flex-end; height: 24px; }
.brand-mark i { width: 8px; border-radius: 3px; display: block; }
.brand-mark i:first-child { height: 24px; background: var(--cover-1211); }
.brand-mark i:last-child { height: 16px; background: var(--cover-1201); }
.nav a, .lib a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--r-s); color: var(--label-2); font-weight: 500; transition: background-color var(--dur-micro), color var(--dur-micro); }
.nav a:hover, .lib a:hover { background: var(--fill-3); color: var(--label); }
.nav a[aria-current="page"], .lib a[aria-current="page"] { background: var(--fill); color: var(--label); }
.nav svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .count { margin-left: auto; font-size: var(--t-foot); color: var(--label-3); }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 20px 12px 8px; font-size: var(--t-foot); font-weight: 600; color: var(--label-3); }
.side-h button { width: 24px; height: 24px; border-radius: 6px; color: var(--label-2); font-size: 18px; line-height: 1; transition: background-color var(--dur-micro); }
.side-h button:hover { background: var(--fill-2); color: var(--label); }
.lib a { height: 52px; padding: 0 8px; }
.lib img { width: 48px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; }
.lib b { display: block; font-weight: 600; color: var(--label); font-size: var(--t-sub); }
.lib span { font-size: var(--t-cap); color: var(--label-3); }
.lib .sel { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--blue-text); flex: none; }
.me { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r-m); transition: background-color var(--dur-micro); }
.me:hover { background: var(--fill-3); }
.me canvas { width: 36px; height: 36px; border-radius: var(--r-s); }
.me b { display: block; font-weight: 600; }
.me span { font-size: var(--t-cap); color: var(--green); }

/* ── Страница ─────────────────────────── */
.main { position: relative; min-width: 0; min-height: 0; overflow: auto; }
.topline { position: sticky; top: 0; z-index: 3; background: var(--base); display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; }
.crumbs { display: flex; gap: 4px; }
.crumbs button { width: 32px; height: 32px; border-radius: var(--r-s); color: var(--label-2); display: grid; place-items: center; transition: background-color var(--dur-micro); }
.crumbs button:hover:not([disabled]) { background: var(--fill-2); color: var(--label); }
.crumbs button[disabled] { color: var(--label-3); background: transparent; cursor: not-allowed; }
.crumbs svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.search-top { margin-left: 8px; flex: 0 1 360px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: var(--r-s); background: var(--fill-3); color: var(--label-3); }
.search-top input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--label); }
.search-top:focus-within { box-shadow: inset 0 0 0 2px var(--blue); }
.search-top svg, .search svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
.winctl { margin-left: auto; display: flex; gap: 4px; }
.winctl button { width: 36px; height: 28px; border-radius: 6px; color: var(--label-3); display: grid; place-items: center; transition: background-color var(--dur-micro), color var(--dur-micro); }
.winctl button:hover { background: var(--fill-2); color: var(--label); }
.winctl button.close:hover { background: var(--red); color: var(--label); }
.winctl svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.page { padding: 0 24px 32px; display: flex; flex-direction: column; gap: 28px; }

.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.h-row h2 { font-size: var(--t-t3); font-weight: 700; }
.h-row button, .h-row a { font-size: var(--t-sub); color: var(--blue-text); font-weight: 500; }
.h-row button:hover, .h-row a:hover { text-decoration: underline; }
.page-title h1 { font-size: var(--t-t1); font-weight: 800; letter-spacing: -.02em; }
.page-title p { margin: 4px 0 0; color: var(--label-2); }

/* Баннер сборки */
.hero { position: relative; border-radius: var(--r-l); overflow: hidden; min-height: 360px; display: flex; align-items: flex-end; isolation: isolate; box-shadow: inset 0 0 0 1px var(--edge); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s var(--ease); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, var(--img-shade), transparent 62%); }
.hero-in { width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 32px; flex-wrap: wrap; }
.hero h1 { font-size: var(--t-hero); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero p { margin: 8px 0 0; color: var(--label-2); max-width: 54ch; }
.hero-actions { display: flex; gap: 8px; align-items: center; }

/* Кнопки */
.btn { height: 40px; padding: 0 16px; border-radius: var(--r-s); background: var(--fill-2); font-weight: 600; font-size: var(--t-sub); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background-color var(--dur-micro); }
.btn:hover { background: var(--fill); }
.btn:active, .mini:active, .play:active { transform: scale(.97); }
.btn.blue { background: var(--blue); color: var(--blue-ink); }
.btn.blue:hover { background: var(--blue-hi); }
.btn.big { height: 52px; padding: 0 28px; font-size: 17px; border-radius: var(--r-m); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }

/* Сетки и карточки */
.grid-3 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.tile { position: relative; border-radius: var(--r-l); overflow: hidden; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); transition: background-color var(--dur-short); }
.tile:hover { background: var(--card-hover); }
.tile-img { position: relative; aspect-ratio: 16 / 7; overflow: hidden; }
.tile-img img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-world) var(--ease); }
.tile-body { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tile-body b { font-weight: 600; }
.tile-body span { font-size: var(--t-foot); color: var(--label-2); }
.continue { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 12px 16px 12px 12px; }
.continue img { width: 160px; height: 96px; border-radius: var(--r-m); object-fit: cover; }
.continue b { font-size: var(--t-t3); font-weight: 700; display: block; }
.continue span { color: var(--label-2); font-size: var(--t-sub); }
.live { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.news { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.panel { color: var(--label); border-radius: var(--r-l); background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); padding: 8px; }
.prow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: var(--r-m); transition: background-color var(--dur-micro); }
.prow:hover { background: var(--fill-3); }
.prow canvas { width: 36px; height: 36px; border-radius: var(--r-s); }
.prow > div { min-width: 0; }
.prow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow span { display: flex; align-items: center; gap: 8px; font-size: var(--t-foot); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow.off { opacity: .5; }
.prow.off canvas { filter: grayscale(1); }
.mini { height: 32px; padding: 0 12px; border-radius: var(--r-s); background: var(--fill-2); font-size: var(--t-foot); font-weight: 600; transition: background-color var(--dur-micro); white-space: nowrap; }
.mini:hover { background: var(--fill); }
.mini.blue { background: var(--blue); color: var(--blue-ink); }
.mini.blue:hover { background: var(--blue-hi); }

/* Страница сборки */
.build-head { position: relative; margin: 0 -24px; min-height: 300px; display: flex; align-items: flex-end; isolation: isolate; }
.build-head > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.build-head::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, var(--veil-strong), transparent 70%); }
.build-head .hero-in { padding: 0 24px 24px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--separator); margin-top: -8px; }
.tabs button { height: 44px; padding: 0 16px; color: var(--label-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--dur-micro), border-color var(--dur-micro); }
.tabs button:hover { color: var(--label); }
.tabs button[aria-selected="true"] { color: var(--label); border-bottom-color: var(--blue-text); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fact { padding: 16px; border-radius: var(--r-m); background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); }
.fact b { display: block; font-size: var(--t-t2); font-weight: 700; }
.fact span { font-size: var(--t-foot); color: var(--label-2); }

/* Списки */
.list { border-radius: var(--r-l); background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden; }
.lrow { display: grid; align-items: center; gap: 16px; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--separator); transition: background-color var(--dur-micro); }
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--fill-3); }
.lrow > div { min-width: 0; }
.lrow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow span { font-size: var(--t-foot); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.lrow-mod { grid-template-columns: 40px minmax(0, 1fr) auto auto; }
.lrow-mod canvas { width: 40px; height: 40px; border-radius: var(--r-s); }
.lrow-world { grid-template-columns: 96px minmax(0, 1fr) auto; }
.lrow-world img { width: 96px; height: 54px; border-radius: var(--r-s); object-fit: cover; }
.lrow-srv { grid-template-columns: 120px minmax(0, 1fr) 140px auto; }
.lrow-srv img { width: 120px; height: 68px; border-radius: var(--r-s); object-fit: cover; }
.meter { display: grid; gap: 8px; font-size: var(--t-foot); color: var(--label-2); }
.meter i { display: block; height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.meter i::after { content: ""; display: block; height: 100%; background: var(--green); transform: scaleX(var(--w)); transform-origin: left; }
.tag { font-size: var(--t-cap); font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--fill-3); color: var(--label-2); white-space: nowrap; }
.tag.up { background: var(--blue-tint); color: var(--blue-text); }
.switch { width: 51px; height: 31px; border-radius: var(--r-pill); background: var(--fill); position: relative; flex: none; transition: background-color var(--dur-short); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--label); box-shadow: 0 3px 8px var(--shade); transition: transform var(--dur-short) var(--ease); }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch[disabled] { opacity: .4; cursor: not-allowed; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: var(--r-s); background: var(--fill-3); color: var(--label-3); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--label); }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--blue); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-s); background: var(--fill-3); }
.seg button { height: 32px; padding: 0 12px; border-radius: 6px; font-size: var(--t-sub); font-weight: 500; color: var(--label-2); transition: background-color var(--dur-micro), color var(--dur-micro); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fill); color: var(--label); }
.empty { padding: 24px 16px; color: var(--label-2); }
.empty b { color: var(--label); }

/* Настройки */
.form { border-radius: var(--r-l); background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; align-items: center; min-height: 64px; padding: 12px 16px; border-bottom: 1px solid var(--separator); }
.frow:last-child { border-bottom: 0; }
.frow.full { grid-template-columns: 1fr; }
.frow .l { font-weight: 500; }
.frow .d { font-size: var(--t-foot); color: var(--label-2); }
.mem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.mem b { font-size: var(--t-t2); font-weight: 700; min-width: 5ch; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--blue); }
select { height: 36px; border-radius: var(--r-s); padding: 0 12px; background: var(--fill-2); border: 0; }
.group-t { font-size: var(--t-foot); font-weight: 600; color: var(--label-3); margin: 0 0 8px 4px; }

/* Гардероб */
.wd { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
.stand { position: relative; height: 460px; border-radius: var(--r-l); overflow: hidden; display: grid; place-items: center; perspective: 900px; cursor: grab; touch-action: pan-y; user-select: none; isolation: isolate; box-shadow: inset 0 0 0 1px var(--edge); }
.stand > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: blur(4px) brightness(.6); }
.stand:active { cursor: grabbing; }
.figure { position: relative; height: 340px; aspect-ratio: 1 / 2; transform-style: preserve-3d; transition: transform 600ms var(--ease); }
.figure.drag { transition: none; }
.figure canvas { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; filter: drop-shadow(0 20px 24px var(--shade)); }
.figure canvas.back { transform: rotateY(180deg); }
.stand small { position: absolute; bottom: 12px; color: var(--label-2); font-size: var(--t-cap); }
.capes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cape { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 4px 12px; border-radius: var(--r-m); background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); font-size: var(--t-foot); font-weight: 600; color: var(--label-2); transition: background-color var(--dur-micro); }
.cape:hover { background: var(--card-hover); }
.cape i { width: 18px; height: 28px; border-radius: 3px; display: block; box-shadow: inset 0 0 0 1px var(--edge); }
.cape[aria-pressed="true"] { background: var(--blue-tint); color: var(--label); box-shadow: inset 0 0 0 1px var(--blue-text); }

/* ── Панель запуска ───────────────────── */
.bar { grid-column: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; padding: 12px 16px 12px 24px; background: var(--bar); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); border-top: 1px solid var(--edge); }
.status { display: flex; align-items: center; gap: 16px; min-width: 0; }
.status img { width: 72px; height: 44px; border-radius: var(--r-s); object-fit: cover; flex: none; }
.status-t { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.status-t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-t span { font-size: var(--t-foot); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; max-width: 520px; }
.track i { display: block; height: 100%; background: var(--blue-text); transform: scaleX(0); transform-origin: left; transition: transform 200ms linear; }
.play { height: 52px; min-width: 180px; padding: 0 28px; border-radius: var(--r-m); background: var(--blue); color: var(--blue-ink); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; transition: background-color var(--dur-micro); white-space: nowrap; }
.play:hover { background: var(--blue-hi); }
.play:active { opacity: .85; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.play.cancel { background: var(--fill-2); color: var(--label); }
.play.cancel:hover { background: var(--fill); }
.play.stop { background: var(--fill-2); color: var(--red); }
.play.stop:hover { background: var(--fill); }
.stage-tick { animation: tick 320ms var(--ease); }
@keyframes tick { from { transform: translateY(50%); opacity: 0; } }

.toast { position: absolute; left: 50%; bottom: 96px; z-index: 9; transform: translateX(-50%); padding: 12px 16px; border-radius: var(--r-m); background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge), 0 12px 30px var(--shade); font-size: var(--t-sub); font-weight: 500; transition: opacity var(--dur-short), transform var(--dur-short) var(--ease); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.js .toast:not(.show) { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

.spec-bg { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--veil); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.spec { width: min(820px, 100%); max-height: 100%; overflow: auto; border-radius: var(--r-l); padding: 28px 32px 32px; background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge); }
.spec h2 { font-size: var(--t-t1); font-weight: 800; }
.spec h3 { font-size: var(--t-t3); font-weight: 700; margin: 24px 0 8px; }
.spec p, .spec li { color: var(--label-2); font-size: var(--t-sub); max-width: 72ch; }
.spec b { color: var(--label); font-weight: 600; }
.spec ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }


/* Обложки сборок и монограммы */
.cover { position: relative; display: grid; place-items: end start; overflow: hidden; color: var(--cover-ink); border-radius: var(--r-s); flex: none; }
.cover b { font-weight: 800; letter-spacing: -.04em; line-height: .8; }
.lib .cover { width: 40px; height: 40px; padding: 4px; }
.lib .cover b { font-size: 11px; }
.mono { display: grid; place-items: center; color: var(--cover-ink); font-weight: 700; border-radius: 50%; flex: none; width: 36px; height: 36px; font-size: 15px; }
.mono.sq { border-radius: var(--r-s); width: 40px; height: 40px; }
.mono.lg { border-radius: var(--r-m); width: 56px; height: 56px; font-size: 22px; }
.me .mono { width: 36px; height: 36px; }
.bar .cover { width: 48px; height: 48px; padding: 8px; border-radius: var(--r-s); }
.bar .cover b { font-size: 13px; }
/* Баннер: обложка сборки, набранная крупно */
.hero { background: var(--hero-c); min-height: 340px; box-shadow: none; color: var(--cover-ink); }
.hero::after { display: none; }
.hero .big-ver { position: absolute; right: -0.04em; bottom: -0.2em; font-size: clamp(160px, 22vw, 300px); font-weight: 800; letter-spacing: -.06em; line-height: 1; opacity: .16; pointer-events: none; user-select: none; }
.hero p { color: var(--cover-ink); opacity: .82; }
.hero .btn:not(.blue) { background: var(--hero-btn); color: var(--cover-ink); }
.hero .btn:not(.blue):hover { background: var(--hero-btn-hi); }
.hero .btn.blue { background: var(--cover-ink); color: var(--hero-c); }
.hero .btn.blue:hover { opacity: .92; }
.build-head { margin: 0; border-radius: var(--r-l); overflow: hidden; background: var(--hero-c); color: var(--cover-ink); min-height: 260px; }
.build-head::after { display: none; }
.build-head .hero-in { padding: 28px 32px; }
.build-head p { color: var(--cover-ink) !important; opacity: .82; }
.build-head .btn:not(.blue) { background: var(--hero-btn); color: var(--cover-ink); }
.build-head .btn.blue { background: var(--cover-ink); color: var(--hero-c); }
.continue { grid-template-columns: 56px minmax(0, 1fr) auto; padding: 16px; }
.news-card { padding: 20px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.news-card time { font-size: var(--t-foot); color: var(--label-3); }
.news-card b { font-size: var(--t-body); font-weight: 600; }
.news-card span { font-size: var(--t-sub); color: var(--label-2); }
.lrow-srv { grid-template-columns: 40px minmax(0, 1fr) 160px auto; }
.lrow-world { grid-template-columns: 40px minmax(0, 1fr) auto; }
.stand { background: var(--fill-3); }
.side { backdrop-filter: none; -webkit-backdrop-filter: none; }


.app span.mono { display: grid; place-items: center; color: var(--cover-ink); font-size: 15px; font-weight: 700; line-height: 1; overflow: visible; white-space: normal; gap: 0; }
.app span.mono.sq { font-size: 16px; }
.app span.mono.lg { font-size: 22px; }
.app span.cover { display: grid; place-items: end start; color: var(--cover-ink); }


/* Пара сборок на главной: выбранная раскрыта, вторая стоит колонкой */
.pair { display: flex; gap: 12px; height: 380px; }
.pane { position: relative; flex: 0 0 104px; border-radius: var(--r-l); overflow: hidden; isolation: isolate; background: var(--hero-c); color: var(--cover-ink); transition: flex-grow 560ms var(--ease); cursor: pointer; }
.pane.open { flex-grow: 1; cursor: default; }
.pane:not(.open):hover { filter: brightness(1.06); }
.pane-ver { position: absolute; right: -0.04em; bottom: -0.2em; z-index: -1; font-size: clamp(160px, 22vw, 300px); font-weight: 800; letter-spacing: -.06em; line-height: 1; opacity: .16; pointer-events: none; user-select: none; white-space: nowrap; transition: opacity var(--dur-short); }
.pane:not(.open) .pane-ver { opacity: 0; }
.pane-side { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 0; transition: opacity var(--dur-short); }
.pane-side b { order: 2; font-size: 40px; font-weight: 800; letter-spacing: -.03em; writing-mode: vertical-rl; transform: rotate(180deg); }
.pane-side span { order: 1; font-size: var(--t-foot); font-weight: 600; opacity: .8; }
.pane.open .pane-side { opacity: 0; pointer-events: none; }
.pane-body { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 32px; min-width: 520px; transition: opacity var(--dur-short) 160ms; }
.js .pane:not(.open) .pane-body { opacity: 0; pointer-events: none; transition-delay: 0s; }
.pane-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.pane-chip { font-size: var(--t-foot); font-weight: 600; padding: 4px 12px; border-radius: var(--r-pill); background: var(--hero-btn); }
.pane-link { font-size: var(--t-sub); font-weight: 600; opacity: .9; }
.pane-link:hover { text-decoration: underline; }
.pane h1 { font-size: var(--t-hero); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.pane p { margin: 8px 0 0; opacity: .85; max-width: 52ch; }
.pane-actions { display: flex; align-items: center; gap: 16px; }
.pane .pane-play { background: var(--cover-ink); color: var(--hero-c); }
.pane .pane-play:hover { opacity: .92; background: var(--cover-ink); }
.pane-note { font-size: var(--t-sub); opacity: .8; }
@media (max-width: 760px) { .pair { flex-direction: column; height: auto; } .pane { flex: 0 0 64px; } .pane.open { flex: 0 0 340px; } .pane-body { min-width: 0; padding: 20px; } .pane-side { flex-direction: row; padding: 0 20px; } .pane-side b { writing-mode: horizontal-tb; transform: none; font-size: 24px; } .pane h1 { font-size: var(--t-t1); } }


/* Логотип, готовность, метка версии у друга */
.ready { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-sub); font-weight: 500; }
.ready i { width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--cover-ink); }
.ready.upd i { background: var(--orange); }
.vtag { display: inline-block; vertical-align: 1px; margin-left: 4px; padding: 0 8px; border-radius: var(--r-pill); font-size: 11px; font-weight: 700; line-height: 18px; color: var(--cover-ink); background: var(--c); }
.app .prow span.vtag { display: inline-block; width: auto; overflow: visible; font-size: 11px; color: var(--cover-ink); gap: 0; }
/* Кнопка поиска в верхней строке */
button.search-top { cursor: pointer; text-align: left; font-size: var(--t-sub); transition: background-color var(--dur-micro); }
button.search-top:hover { background: var(--fill-2); }
button.search-top span { flex: 1; }
button.search-top kbd, .cmd kbd { font: 600 11px var(--font); padding: 2px 8px; border-radius: 6px; background: var(--fill-2); color: var(--label-2); }
/* Командная строка */
.cmd-bg { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; background: var(--veil); }
.cmd { width: min(620px, calc(100% - 32px)); border-radius: var(--r-l); background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge), 0 30px 80px var(--shade); overflow: hidden; animation: cmdIn var(--dur-short) var(--ease); }
@keyframes cmdIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
.cmd-in { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--separator); color: var(--label-3); }
.cmd-in svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.cmd-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: var(--t-t3); color: var(--label); }
.cmd-list { max-height: 380px; overflow: auto; padding: 8px; }
.cmd-g { padding: 8px 12px 4px; font-size: var(--t-cap); font-weight: 600; color: var(--label-3); }
.cmd-row { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-s); text-align: left; }
.cmd-row b { font-weight: 500; white-space: nowrap; }
.cmd-row span { color: var(--label-3); font-size: var(--t-foot); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.cmd-row kbd { margin-left: auto; }
.cmd-row:hover { background: var(--fill-3); }
.cmd-row[aria-selected="true"] { background: var(--blue); color: var(--blue-ink); }
.cmd-row[aria-selected="true"] span { color: var(--blue-ink); opacity: .8; }
.cmd-empty { padding: 20px 12px; color: var(--label-2); }
.cmd-foot { display: flex; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--separator); font-size: var(--t-cap); color: var(--label-3); }
.cmd-foot kbd { margin-right: 4px; }


/* ═══ Движение ═══
   Каждая анимация отвечает на действие или показывает, что изменилось. Всё отключается при «Уменьшить движение». */
.btn, .mini, .play, .cape, .side-h button { transition: background-color var(--dur-micro), transform var(--dur-micro) var(--ease), opacity var(--dur-micro); }
/* Появление страницы: блоки поднимаются по очереди */
.page.stagger > * { animation: rise var(--dur-page) var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
/* Смена страницы через View Transitions: старая уходит, новая приходит */
.page { view-transition-name: page; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(page) { animation: vt-out 180ms var(--ease) both; }
::view-transition-new(page) { animation: none; }
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
/* Плавающие индикаторы: раздел в боковой панели, вкладки, сегменты */
.nav, .lib, .tabs, .seg { position: relative; }
.ind { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; transform-origin: 0 0; transition: transform var(--dur-ind) var(--spring), opacity var(--dur-short); }
.nav > .ind, .lib > .ind { border-radius: var(--r-s); background: var(--fill); }
.tabs > .ind { top: auto; bottom: -1px; height: 2px; background: var(--blue-text); border-radius: 2px; }
.seg > .ind { border-radius: 6px; background: var(--fill); }
.nav a, .lib a, .tabs button, .seg button { position: relative; z-index: 1; }
.nav a[aria-current="page"], .lib a[aria-current="page"], .seg button[aria-pressed="true"] { background: transparent; }
.tabs button[aria-selected="true"] { border-bottom-color: transparent; }
/* Пара сборок: перетекание с пружиной, содержимое выходит по очереди, крупная цифра следует за курсором */
.pane { transition: flex-grow var(--dur-pair) var(--spring), filter var(--dur-short); }
.pane.open .pane-body > * { animation: rise 520ms var(--ease) both; }
.pane.open .pane-body > :nth-child(2) { animation-delay: 70ms; }
.pane.open .pane-body > :nth-child(3) { animation-delay: 140ms; }
.pane-ver { transform: translate(calc(var(--px, 0) * -18px), calc(var(--py, 0) * -10px)); transition: opacity var(--dur-short), transform 900ms var(--ease); }
.pane.open .pane-ver { animation: ver-in 900ms var(--ease) both; }
@keyframes ver-in { from { opacity: 0; translate: 60px 0; } }
.pane:not(.open):hover .pane-side b { transform: rotate(180deg) translateY(4px); }
.pane-side b { transition: transform var(--dur-short) var(--spring); }
/* Карточки приподнимаются под курсором */
.tile, .fact { transition: background-color var(--dur-short), transform var(--dur-short) var(--ease), box-shadow var(--dur-short); }
.tile:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--edge), var(--lift); }
/* Счётчики досчитываются */
.count-up { display: inline-block; }
/* Панель запуска: бегущий блик по полосе загрузки, вспышка при старте игры, смена кнопки */
.track { position: relative; }
.track::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--sweep), transparent); transform: translateX(-100%); animation: sweep 1.4s var(--ease) infinite; }
@keyframes sweep { to { transform: translateX(100%); } }
.bar { position: relative; }
.bar.started::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--green); transform-origin: left; animation: started 900ms var(--ease) both; }
@keyframes started { from { transform: scaleX(0); } 70% { opacity: 1; } to { transform: scaleX(1); opacity: 0; } }
.play.swap { animation: swap 360ms var(--spring); }
@keyframes swap { 0% { transform: scale(.94); opacity: .6; } }
#barCover .cover { animation: cover-in 420ms var(--spring); }
@keyframes cover-in { from { transform: scale(.8) rotate(-6deg); opacity: 0; } }
/* Уведомление и командная строка — пружиной */
.toast { transition: opacity var(--dur-short), transform var(--dur-ind) var(--spring); }
.cmd { animation: cmdIn 360ms var(--spring); }
.cmd-row { transition: background-color var(--dur-micro), color var(--dur-micro); }
/* Переключатель — пружиной, как системный */
.switch::after { transition: transform var(--dur-ind) var(--spring); }
/* Модалка спецификации */
.spec { animation: cmdIn 360ms var(--spring); }


/* ═══ Гардероб ═══ */
.wd2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.stage3d { position: relative; height: 560px; border-radius: var(--r-l); overflow: hidden; background: radial-gradient(60% 50% at 50% 42%, var(--stage-a), transparent 70%), var(--card); box-shadow: inset 0 0 0 1px var(--edge); cursor: grab; touch-action: pan-y; user-select: none; perspective: 1400px; }
.stage3d:active { cursor: grabbing; }
.rig-wrap { position: absolute; left: 50%; top: 53%; transform-style: preserve-3d; transform: rotateX(-8deg); }
.rig { position: relative; transform-style: preserve-3d; transform: rotateY(var(--turn, 0deg)); transition: transform 700ms var(--spring); }
.rig.now { transition: none; }
.joint { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.swing { transform-style: preserve-3d; transform-origin: 0 0; }
.box, .box-group { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.box-group > .box { transform: none !important; }
.face { position: absolute; left: 0; top: 0; image-rendering: pixelated; backface-visibility: hidden; }
.hat .face { backface-visibility: visible; }
.floor { position: absolute; left: 50%; top: calc(53% + 16 * 11px); width: 224px; height: 40px; margin-left: -112px; margin-top: -20px; border-radius: 50%; background: radial-gradient(var(--floor), transparent 70%); pointer-events: none; }
.nametag { position: absolute; left: 50%; top: calc(53% - 16 * 11px - 48px); transform: translateX(-50%); padding: 4px 12px; border-radius: 6px; background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge); font-weight: 600; font-size: var(--t-sub); white-space: nowrap; z-index: 2; }
.stage-top { position: absolute; left: 20px; top: 16px; display: flex; flex-direction: column; gap: 2px; }
.stage-top b { font-weight: 700; }
.stage-top span { font-size: var(--t-foot); color: var(--label-2); }
.stage-bar { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 2; }
.stage-bar .seg { background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge); }
.stage-tools { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-s); background: var(--veil-strong); box-shadow: inset 0 0 0 1px var(--edge); }
.icon-b { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--label-2); transition: background-color var(--dur-micro), color var(--dur-micro); }
.icon-b:hover { background: var(--fill-2); color: var(--label); }
.icon-b[aria-pressed="true"] { background: var(--blue-tint); color: var(--blue-text); }
.icon-b svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
/* Позы: суставы качаются вокруг плеча и бедра */
.pose-idle .j-armR .swing { animation: idleR 3.2s ease-in-out infinite; }
.pose-idle .j-armL .swing { animation: idleL 3.2s ease-in-out infinite; }
@keyframes idleR { 50% { transform: rotateZ(4deg); } }

ых кнопок и строк, 16 у карточек и баннеров.</li><li>Движение только в ответ на действие; при «Уменьшить движение» всё мгновенно.</li></ul></div>`;
